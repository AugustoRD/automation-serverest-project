name: Playwright Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      serverest:
        image: paulogoncalvesbh/serverest:latest
        ports:
          - 3000:3000
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir a Imagem Docker (Build)
        run: docker build -t testes-api-serverest .

      - name: Executar os Testes no Container (Run)
        run: docker run --network host -e BASE_URL="http://localhost:3000" -v ${{ github.workspace }}/playwright-report:/app/playwright-report testes-api-serverest

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
